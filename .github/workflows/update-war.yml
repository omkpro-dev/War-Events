name: Update war feed

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay runs a little)
  workflow_dispatch:
    inputs:
      selftest:
        description: "Also make one test call to check the claims model settings"
        type: boolean
        default: false
  push:
    paths:
      - "war-feed/**"
      - ".github/workflows/update-war.yml"

permissions:
  contents: write

concurrency:
  group: war-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Previous data (war-data branch)
        run: |
          mkdir -p war-feed/out
          if git ls-remote --exit-code --heads origin war-data >/dev/null 2>&1; then
            git fetch --depth=1 origin war-data
            git --work-tree=war-feed/out checkout FETCH_HEAD -- . || true
          fi
          ls -la war-feed/out
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: war-feed
        run: npm install --no-audit --no-fund
      - name: Collect, extract claims, verify
        working-directory: war-feed
        run: node run.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-5-5
      - name: Self-test claims model
        if: inputs.selftest
        working-directory: war-feed
        run: node --input-type=module -e "const { selfTest } = await import('./war-news/claims.js'); await selfTest();"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-5-5
          CLAIMS_FILE: /tmp/selftest-claims.json
      - name: Publish to war-data branch (one commit, no history build-up)
        working-directory: war-feed/out
        run: |
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json   # data only: Vercel skips this branch
          git init -q
          git config user.name "war-bot"
          git config user.email "war-bot@users.noreply.github.com"
          git checkout -q -b war-data
          git add -A
          git commit -q -m "War data $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" war-data
