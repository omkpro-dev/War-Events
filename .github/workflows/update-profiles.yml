name: Update country profiles

on:
  schedule:
    - cron: "30 4 * * *"   # daily, 04:30 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profiles
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Previous data (profiles-data branch)
        run: |
          # The bot's files live on the profiles-data branch (one commit, no history build-up).
          # Until that branch exists, the copies checked into main are the starting point.
          if git ls-remote --exit-code --heads origin profiles-data >/dev/null 2>&1; then
            git fetch --depth=1 origin profiles-data
            git checkout FETCH_HEAD -- data/country_stats.json || true
            git reset -q
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh profiles (UN alignment, overviews)
        run: python news-feed/fetch_country_profiles.py
      - name: Geopolitical overviews (Claude)
        run: python news-feed/write_overviews.py
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-haiku-5-5
      - name: Publish to profiles-data branch (one commit, no history build-up)
        run: |
          mkdir -p /tmp/pub/data
          cp data/country_stats.json /tmp/pub/data/
          cd /tmp/pub
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json   # data only: Vercel skips this branch
          git init -q
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git checkout -q -b profiles-data
          git add -A
          git commit -q -m "profiles-data $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" profiles-data
