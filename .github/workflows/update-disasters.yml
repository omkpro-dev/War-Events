name: Update disasters

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may delay runs a little)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: disasters
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Previous data (disasters-data branch)
        run: |
          mkdir -p dz-out
          if git ls-remote --exit-code --heads origin disasters-data >/dev/null 2>&1; then
            git fetch --depth=1 origin disasters-data
            git --work-tree=dz-out checkout FETCH_HEAD -- . || true
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect disasters (GDACS, USGS, EMSC, NHC, JTWC, FIRMS, Smithsonian, ReliefWeb, CO2, air) + Logistics/Disasters news
        run: |
          python news-feed/fetch_disasters.py dz-out
          python news-feed/fetch_topic_news.py dz-out
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-haiku-5-5
      - name: Push to Vandict
        run: FEED_PATH=data/disasters.json python news-feed/push_to_vandict.py --source gdacs-disasters
        continue-on-error: true
        env:
          VANDICT_INGEST_URL: ${{ secrets.VANDICT_INGEST_URL }}
          VANDICT_INGEST_KEY: ${{ secrets.VANDICT_INGEST_KEY }}
      - name: Publish to disasters-data branch (one commit, no history build-up, no site redeploy)
        working-directory: dz-out
        run: |
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json   # data only: Vercel skips this branch
          git init -q
          git config user.name "disasters-bot"
          git config user.email "disasters-bot@users.noreply.github.com"
          git checkout -q -b disasters-data
          git add -A
          git commit -q -m "Disasters $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" disasters-data
      - name: Copy to Cloudflare R2 (the app's first source; skipped until the R2 secrets exist)
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then echo "R2 secrets not set; skipping"; exit 0; fi
          R2_ACCOUNT_ID=$(printf %s "$R2_ACCOUNT_ID" | tr -d '[:space:]')
          if ! printf %s "$R2_ACCOUNT_ID" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "R2_ACCOUNT_ID is not a 32-character account id (it is ${#R2_ACCOUNT_ID} characters); skipping"; exit 1
          fi
          cd "$GITHUB_WORKSPACE/dz-out"
          for f in disasters.json; do
            [ -f "$f" ] || continue
            aws s3 cp "$f" "s3://war-events-data/disasters-data/$f" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
              --content-type application/json --cache-control "public, max-age=60" --only-show-errors
          done
      - name: Refresh the CDN copy (the app reads these files from jsDelivr first)
        continue-on-error: true
        run: |
          for f in disasters.json; do
            curl -s -m 20 --retry 2 "https://purge.jsdelivr.net/gh/${{ github.repository }}@disasters-data/$f" > /dev/null || true
          done
