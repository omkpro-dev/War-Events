name: Update elections

on:
  schedule:
    - cron: "15 5 * * *"   # daily, 05:15 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: elections
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Previous data (elections-data branch)
        run: |
          # The bot's files live on the elections-data branch (one commit, no history build-up).
          # Until that branch exists, the copies checked into main are the starting point.
          if git ls-remote --exit-code --heads origin elections-data >/dev/null 2>&1; then
            git fetch --depth=1 origin elections-data
            git checkout FETCH_HEAD -- data/elections.json data/polls.json || true
            git reset -q
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh elections (Claude + web search)
        run: python news-feed/update_elections.py
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-haiku-5-5
      - name: Poll averages (from the polling companies)
        run: python news-feed/fetch_polls.py
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-haiku-5-5
      - name: Publish to elections-data branch (one commit, no history build-up)
        run: |
          mkdir -p /tmp/pub/data
          cp data/elections.json data/polls.json /tmp/pub/data/
          cd /tmp/pub
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json   # data only: Vercel skips this branch
          git init -q
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git checkout -q -b elections-data
          git add -A
          git commit -q -m "elections-data $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" elections-data
