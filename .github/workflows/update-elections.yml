name: Update elections

on:
  schedule:
    - cron: "15 5 * * *"   # daily, 05:15 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh elections (Claude + web search)
        run: python news-feed/update_elections.py
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-haiku-5-5
      - name: Poll averages (from the polling companies)
        run: python news-feed/fetch_polls.py
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-haiku-5-5
      - name: Commit if changed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/elections.json data/polls.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update elections"
          # Another run may have pushed meanwhile: retry, keeping our freshly generated data file.
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
