name: Update elections

on:
  schedule:
    - cron: "15 5 * * *"   # daily, 05:15 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: elections
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Previous data (elections-data branch)
        run: |
          # The bot's files live on the elections-data branch (one commit, no history build-up).
          # Until that branch exists, the copies checked into main are the starting point.
          if git ls-remote --exit-code --heads origin elections-data >/dev/null 2>&1; then
            git fetch --depth=1 origin elections-data
            git checkout FETCH_HEAD -- data/elections.json data/polls.json || true
            git reset -q
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh elections (Claude + web search)
        run: python news-feed/update_elections.py
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-haiku-5-5
      - name: Poll averages (from the polling companies)
        run: python news-feed/fetch_polls.py
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-haiku-5-5
      - name: Publish to elections-data branch (one commit, no history build-up)
        run: |
          mkdir -p /tmp/pub/data
          cp data/elections.json data/polls.json /tmp/pub/data/
          cd /tmp/pub
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json   # data only: Vercel skips this branch
          git init -q
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git checkout -q -b elections-data
          git add -A
          git commit -q -m "elections-data $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" elections-data
      - name: Copy to Cloudflare R2 (the app's first source; skipped until the R2 secrets exist)
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then echo "R2 secrets not set; skipping"; exit 0; fi
          cd /tmp/pub
          for f in data/elections.json; do
            [ -f "$f" ] || continue
            aws s3 cp "$f" "s3://war-events-data/elections-data/$f" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
              --content-type application/json --cache-control "public, max-age=60" --only-show-errors
          done
      - name: Refresh the CDN copy (the app reads these files from jsDelivr first)
        continue-on-error: true
        run: |
          for f in data/elections.json; do
            curl -s -m 20 --retry 2 "https://purge.jsdelivr.net/gh/${{ github.repository }}@elections-data/$f" > /dev/null || true
          done
