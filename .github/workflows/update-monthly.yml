name: Monthly data (Power core + economy)

on:
  schedule:
    - cron: "17 4 1 * *"   # 04:17 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Previous data (monthly-data branch)
        run: |
          # The bot's files live on the monthly-data branch (one commit, no history build-up).
          # Until that branch exists, the copies checked into main are the starting point.
          if git ls-remote --exit-code --heads origin monthly-data >/dev/null 2>&1; then
            git fetch --depth=1 origin monthly-data
            git checkout FETCH_HEAD -- data/economic.json data/eco data/power.json || true
            git reset -q
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Economy (World Bank + IMF)
        run: python news-feed/update_economic.py
      - name: Power core (PPP factors + Claude review of spheres, buffers, leverage, rivalries)
        run: python news-feed/update_power.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-haiku-5-5
      - name: Publish to monthly-data branch (one commit, no history build-up)
        run: |
          mkdir -p /tmp/pub/data
          cp -R data/economic.json data/eco data/power.json /tmp/pub/data/
          cd /tmp/pub
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json   # data only: Vercel skips this branch
          git init -q
          git config user.name "war-events-bot"
          git config user.email "bot@warevents.com"
          git checkout -q -b monthly-data
          git add -A
          git commit -q -m "monthly-data $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" monthly-data
      - name: Copy to Cloudflare R2 (the app's first source; skipped until the R2 secrets exist)
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then echo "R2 secrets not set; skipping"; exit 0; fi
          R2_ACCOUNT_ID=$(printf %s "$R2_ACCOUNT_ID" | tr -d '[:space:]')
          if ! printf %s "$R2_ACCOUNT_ID" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "R2_ACCOUNT_ID is not a 32-character account id (it is ${#R2_ACCOUNT_ID} characters); skipping"; exit 1
          fi
          cd /tmp/pub
          for f in data/power.json; do
            [ -f "$f" ] || continue
            aws s3 cp "$f" "s3://war-events-data/monthly-data/$f" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
              --content-type application/json --cache-control "public, max-age=60" --only-show-errors
          done
      - name: Refresh the CDN copy (the app reads these files from jsDelivr first)
        continue-on-error: true
        run: |
          for f in data/power.json; do
            curl -s -m 20 --retry 2 "https://purge.jsdelivr.net/gh/${{ github.repository }}@monthly-data/$f" > /dev/null || true
          done
