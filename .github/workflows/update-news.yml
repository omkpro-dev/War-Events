name: Update news stories

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may delay runs a little)
  workflow_dispatch:        # "Run workflow" button
  push:
    paths:
      - "news-feed/remove.txt"
      - "news-feed/*.py"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write

concurrency:
  group: news-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Previous data (news-data branch)
        run: |
          # The bot's files live on the news-data branch (one commit, no history build-up).
          # Until that branch exists, the copies checked into main are the starting point.
          if git ls-remote --exit-code --heads origin news-data >/dev/null 2>&1; then
            git fetch --depth=1 origin news-data
            git checkout FETCH_HEAD -- key_developments.json news-feed/seen_articles.json data/country_news.json news-feed/enrich_cache.json || true
            git reset -q
          fi
      - name: Fetch stories
        run: python news-feed/fetch_news.py
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          GNEWS_KEY: ${{ secrets.GNEWS_KEY }}
          # OUTPUT_PATH: public/key_developments.json   # if the site isn't at the repo root
      - name: Summaries + impact (Claude)
        run: python news-feed/enrich_stories.py
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Fetch one story per country
        run: python news-feed/fetch_country_news.py
        continue-on-error: true
      - name: Publish to news-data branch (one commit, no history build-up)
        run: |
          mkdir -p /tmp/pub && cd "$GITHUB_WORKSPACE"
          for f in key_developments.json news-feed/seen_articles.json data/country_news.json news-feed/enrich_cache.json; do
            [ -f "$f" ] && mkdir -p "/tmp/pub/$(dirname "$f")" && cp "$f" "/tmp/pub/$f"
          done
          cd /tmp/pub
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json   # data only: Vercel skips this branch
          git init -q
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git checkout -q -b news-data
          git add -A
          git commit -q -m "news-data $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" news-data
