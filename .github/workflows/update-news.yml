name: Update news stories

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may delay runs a little)
  workflow_dispatch:        # "Run workflow" button
  push:
    branches: [main]
    paths:
      - "news-feed/remove.txt"
      - "news-feed/*.py"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write

concurrency:
  group: news-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Previous data (news-data branch)
        run: |
          # The bot's files live on the news-data branch (one commit, no history build-up).
          # Until that branch exists, the copies checked into main are the starting point.
          if git ls-remote --exit-code --heads origin news-data >/dev/null 2>&1; then
            git fetch --depth=1 origin news-data
            git checkout FETCH_HEAD -- key_developments.json news-feed/seen_articles.json data/country_news.json news-feed/enrich_cache.json || true
            # The push script's memory of what it already sent (missing until the first push run publishes it).
            git checkout FETCH_HEAD -- news-feed/push_sent.json 2>/dev/null || true
            git reset -q
          fi
          # The feed as phones can already download it: a push only goes out for a story that was in it, so
          # tapping the alert never opens "no longer in the feed" while the new feed is still on its way.
          cp key_developments.json "$RUNNER_TEMP/published_feed.json" 2>/dev/null || echo "[]" > "$RUNNER_TEMP/published_feed.json"
      - name: Fetch stories
        run: python news-feed/fetch_news.py
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          GNEWS_KEY: ${{ secrets.GNEWS_KEY }}
          # OUTPUT_PATH: public/key_developments.json   # if the site isn't at the repo root
      - name: Summaries + impact (Claude)
        run: python news-feed/enrich_stories.py
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Push to Vandict
        run: python news-feed/push_to_vandict.py
        continue-on-error: true
        env:
          VANDICT_INGEST_URL: ${{ secrets.VANDICT_INGEST_URL }}
          VANDICT_INGEST_KEY: ${{ secrets.VANDICT_INGEST_KEY }}
      - name: Push alert to the iPhone app (major stories only)
        run: |
          pip install --quiet google-auth requests
          python news-feed/send_push.py
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PUBLISHED_FEED_PATH: ${{ runner.temp }}/published_feed.json
      - name: Fetch one story per country
        run: python news-feed/fetch_country_news.py
        continue-on-error: true
      - name: Publish to news-data branch (one commit, no history build-up)
        run: |
          mkdir -p /tmp/pub && cd "$GITHUB_WORKSPACE"
          for f in key_developments.json news-feed/seen_articles.json data/country_news.json news-feed/enrich_cache.json news-feed/push_sent.json; do
            [ -f "$f" ] && mkdir -p "/tmp/pub/$(dirname "$f")" && cp "$f" "/tmp/pub/$f"
          done
          cd /tmp/pub
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json   # data only: Vercel skips this branch
          git init -q
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git checkout -q -b news-data
          git add -A
          git commit -q -m "news-data $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" news-data
      - name: Copy to Cloudflare R2 (the app's first source; skipped until the R2 secrets exist)
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then echo "R2 secrets not set; skipping"; exit 0; fi
          # Accepts the bare 32-character account id or the whole endpoint address.
          R2_ACCOUNT_ID=$(printf %s "$R2_ACCOUNT_ID" | tr -d '[:space:]' | sed -E -e 's#^https?://##' -e 's#[.]r2[.]cloudflarestorage[.]com.*$##' -e 's#/.*$##')
          if ! printf %s "$R2_ACCOUNT_ID" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "R2_ACCOUNT_ID is not a 32-character account id (it is ${#R2_ACCOUNT_ID} characters); skipping"; exit 1
          fi
          cd /tmp/pub
          for f in key_developments.json; do
            [ -f "$f" ] || continue
            aws s3 cp "$f" "s3://war-events-data/news-data/$f" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
              --content-type application/json --cache-control "public, max-age=60" --only-show-errors
          done
      - name: Refresh the CDN copy (the app reads these files from jsDelivr first)
        continue-on-error: true
        run: |
          for f in key_developments.json; do
            curl -s -m 20 --retry 2 "https://purge.jsdelivr.net/gh/${{ github.repository }}@news-data/$f" > /dev/null || true
          done
